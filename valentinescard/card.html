<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <!-- Question Screen -->
    <div class="question-screen" id="questionScreen">
        <div class="hearts">💝💕💖</div>
        <h1 class="question-title">Will You Be My Valentine?</h1>
        
        <div class="buttons-container" id="buttonsContainer">
            <button id="yesBtn">Yes! 💕</button>
            <button id="noBtn">No</button>
        </div>
        
        <div class="dodge-message" id="dodgeMessage"></div>
    </div>

    <!-- Envelope Screen -->
    <div class="envelope-screen" id="envelopeScreen">
        <div class="container" onclick="openEnvelope()">
            <div class="envelope" id="envelope">
                <div class="envelope-back"></div>
                <div class="envelope-flap"></div>
            </div>
            <div class="click-text" id="clickText">Click to open</div>
            
            <div class="card" id="card">
                <div class="card-inner">
                    <div class="heart"></div>
                    <h1>Happy Valentine's Day!</h1>
                    <p>My palangga, my favorite person. Ikaw ang cherry ng cupcake ko HIHI ❤️</p>
                </div>
            </div>
        </div>
    </div>

    <script src="card.js"></script>
</body>
</html>

Reflection:
1. What AI tool did I use?
I used Claude AI to help me create and refine my Valentine’s card, and I used imgbb.com to generate an image link for the pictures I included in my project. Claude AI assisted me in generating the HTML and CSS code based on my descriptions, while imgbb.com helped me host my image so I could properly display it on my webpage.

2. How did it help me? 
Using AI truly made the process easier and less overwhelming. Instead of manually writing every line of code from scratch, I was able to describe what I wanted, and the AI generated a structured version of the code for me. However, it was not just a simple copy and paste process. I still had to guide the AI like for example, correct certain parts, and make sure the output matched my vision. It felt like working with a digital assistant because it sped up the technical part, but I remained in control of the design and final decisions. This helped me save time while still understanding how the code works.

3. What did I modify or improve?
Although the AI generated the initial version, I made several personal modifications. I adjusted the color palette to match the romantic theme I wanted. I changed the background design to make it softer and more visually pleasing. I customized the animations so that the card would appear in a specific sequence that felt meaningful and intentional. I also selected fonts that better reflected the tone of the Valentine’s message. These adjustments made the project feel more personal rather than purely AI generated.

4. What did I learn from this activity?
This activity taught me the importance of patience and clarity. I realized that AI can only give good results if I give clear and specific instructions. I had to be detail oriented and really think about what I wanted the final output to look like. It challenged me to verbalize my ideas clearly and translate my imagination into precise words.This experience truly reminded me that technology is a tool, but creativity and critical thinking should still come from me. AI does supports the process, but I am still responsible for the final product after all.
